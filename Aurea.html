.s{position:absolute;left:0;top:0;width:var(--d);height:var(--d);margin:calc(var(--d)/-2);border-radius:50%;border:1px solid var(--ln);background:var(--nz),var(--sf);padding:0;box-shadow:0 10px 20px -10px rgba(0,0,0,.5);transform:translate(0,0) scale(.1);opacity:0;transition:transform .75s cubic-bezier(.2,1.2,.3,1) calc(var(--i)*40ms),opacity .3s calc(var(--i)*40ms)}
.open .s{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
.s.m{border-color:var(--ac);color:var(--ac)}
.i{display:grid;place-items:center;width:100%;height:100%;position:relative;border-radius:50%}
.s svg{width:20px;height:20px}
.i em{position:absolute;top:calc(100% + 5px);font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap}
#mod{position:absolute;inset:0;z-index:40;max-width:430px;margin:0 auto;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px 28px;box-sizing:border-box;transform:scale(.3);opacity:0;pointer-events:none;border-radius:44px;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .3s,border-radius .5s}
#mod.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.hd{display:flex;justify-content:space-between}
h2{font-size:36px;line-height:1.05;margin:22px 0 6px}
.sb{color:var(--mu);margin:0 0 14px}.sb b{color:var(--ac);font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--ln);animation:up .5s both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.g{flex:1;min-width:0}.t{font-weight:500}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mu);flex:none;display:grid;place-items:center;transition:.25s}
.ck svg{width:14px;height:14px;opacity:0;color:var(--bg)}
.done .ck{background:var(--ac);border-color:var(--ac)}.done .ck svg{opacity:1}.done .t{opacity:.45;text-decoration:line-through}
.wk{display:flex;gap:6px}.wk i{width:18px;text-align:center;font:600 10px/18px Manrope;color:var(--mu);font-style:normal}
.d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ln);box-sizing:border-box;display:block}
.d.y{background:var(--ac);border-color:var(--ac)}.d.f{border-style:dashed;opacity:.5}.d.t{border-color:var(--ac)}
.wkc{display:flex;justify-content:space-between;margin:4px 0 10px}
.dy{border:0;background:none;display:grid;gap:4px;justify-items:center;padding:8px 0;width:44px;border-radius:22px}
.dy small{font-size:11px;color:var(--mu);font-weight:600}.dy span{font:400 19px Fraunces,Georgia,serif}
.dy.on{background:var(--ac);color:var(--bg)}.dy.on small{color:inherit}
.tm{font:400 20px Fraunces,Georgia,serif;width:62px}
.past{opacity:.45}
.nt .t{font:400 20px Fraunces,Georgia,serif;margin-bottom:3px}
.nt .sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em{text-align:center;padding:60px 20px}
.eo{width:92px;height:92px;border-radius:50%;border:1px dashed var(--mu);margin:0 auto 22px;display:grid;place-items:center;color:var(--mu)}
.eo svg{width:34px;height:34px}
h3{font-size:24px;margin:0 0 8px}.em p{color:var(--mu);margin:0 0 22px}
.pill{border:0;background:var(--ink);color:var(--bg);padding:12px 26px;border-radius:99px;font-weight:600}
@media(prefers-reduced-motion:reduce){.ring,.o .i{animation:none}}

/* C06.2 · FAB */
#fab{display:none!important;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);right:calc(50% - 215px + 20px);width:52px;height:52px;border-radius:50%;background:var(--ac);color:var(--bg);font:300 26px/1 system-ui,sans-serif;border:0;z-index:35;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);display:grid;place-items:center;padding:0}
@media(max-width:430px){#fab{right:20px}}
#mod.open~#fab{display:none!important}

/* C13.1 · FAB no se monta con teclado */
body.kb-up #fab,body.kb-up #fp,body.kb-up #ts{display:none!important}
#sh{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);overflow-y:auto}
@supports not (height:100dvh){#sh{max-height:calc(100vh - env(safe-area-inset-top,0px) - 20px)}}

/* C14.1 · Secciones avanzadas colapsables */
details.adv{margin:16px 0 6px;border:1px solid var(--ln);border-radius:14px;background-color:var(--sf);background-image:var(--nz);overflow:hidden}
details.adv summary{padding:13px 16px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;letter-spacing:.02em}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:'▾';font-size:13px;color:var(--mu);transition:transform .2s;transform:rotate(-90deg)}
details.adv[open] summary::after{transform:rotate(0)}
details.adv[open] summary{border-bottom:1px solid var(--ln)}
details.adv>div{padding:0 16px 16px}
details.adv>div>.fl:first-child{margin-top:14px}
</style>
<style id="lock-css">

#lock.on{display:flex}
.lki{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px}
.lki img{width:72px;height:72px;border-radius:20px;display:block}
.lki .sm{margin:0;min-height:2.8em}
#lock .pill{width:auto;margin-top:8px;padding:13px 30px}
#lock .pill:disabled{opacity:.5}
.sw{width:46px;height:28px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);position:relative;padding:0;flex:none;transition:background .25s,border-color .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:transform .25s cubic-bezier(.2,.9,.3,1),background .25s}
.sw[aria-checked="true"]{background:var(--ac);border-color:var(--ac)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--bg)}
.sw:disabled{opacity:.45;cursor:default}
</style>

<script>
(function(){'use strict';
var KEY='aurea.lock',SS='aurea.lk.',GRACE=30000,STALE=90000;
var $i=function(i){return document.getElementById(i)},el=$i('lock'),msg=$i('lkm'),btn=$i('lkb'),appEl=$i('app'),modEl=$i('mod');
var LK={on:0,locked:0,cover:0,busy:0,busyAt:0,quiet:0,away:0,act:1,err:''};
var M={userCancel:'Cancelaste la verificación.',systemCancel:'El sistema canceló la verificación.',appCancel:'Verificación cancelada.',authenticationFailed:'No se reconoció tu identidad.',biometryLockout:'Demasiados intentos. Espera un momento o usa el PIN, patrón o contraseña del teléfono.',biometryNotAvailable:'Este teléfono no tiene huella ni bloqueo de pantalla disponibles.',biometryNotEnrolled:'No hay huella registrada ni bloqueo de pantalla en este teléfono.',passcodeNotSet:'Este teléfono no tiene bloqueo de pantalla. Actívalo en los ajustes de Android.',noDeviceCredential:'Este teléfono no tiene bloqueo de pantalla. Actívalo en los ajustes de Android.',noapi:'No se pudo cargar la verificación del teléfono. Cierra y vuelve a abrir Áurea.'},DEF='No se pudo verificar tu identidad.';
function lsG(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsS(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);return true}catch(_){return false}}
function ssG(k){try{return sessionStorage.getItem(SS+k)}catch(_){return null}}
function ssS(k,v){try{v==null?sessionStorage.removeItem(SS+k):sessionStorage.setItem(SS+k,v)}catch(_){}}
var NAT=function(){try{var c=window.Capacitor;return !!(c&&c.isNativePlatform&&c.isNativePlatform())}catch(_){return false}};
var API=function(){return window.AureaNative||null};
function draw(){
 el.classList.toggle('on',!!(LK.locked||LK.cover));
 try{appEl.inert=modEl.inert=!!LK.locked}catch(_){}
 msg.textContent=LK.locked?(LK.busy?'Verificando…':(LK.err?(M[LK.err]||DEF):'Verifica tu identidad para abrir Áurea.')):'';
 btn.hidden=!LK.locked;btn.disabled=!!LK.busy;btn.textContent=LK.busy?'Verificando…':'Desbloquear'}
function auth(reason,sub){
 var N=API();
 if(!N||typeof N.authenticate!=='function'){LK.err='noapi';draw();return Promise.resolve(false)}
 if(LK.busy&&Date.now()-LK.busyAt<STALE)return Promise.resolve(false);
 LK.busy=1;LK.busyAt=Date.now();LK.err='';draw();
 return Promise.resolve().then(function(){return N.authenticate({reason:reason,cancelTitle:'Cancelar',allowDeviceCredential:true,androidTitle:'Áurea',androidSubtitle:sub||reason,androidConfirmationRequired:false})})
  .then(function(){return true},function(e){LK.err=(e&&e.code)||'fail';return false})
  .then(function(ok){LK.busy=0;LK.quiet=Date.now()+1500;return ok})}
function unlock(){LK.locked=0;LK.cover=0;LK.err='';LK.away=0;ssS('ok','1');ssS('away',null);draw()}
function lock(){LK.locked=1;LK.cover=0;LK.err='';ssS('ok',null);draw()}
function prompt(){
 if(!LK.locked||(LK.busy&&Date.now()-LK.busyAt<STALE))return;
 auth('Desbloquea Áurea','Verifica tu identidad para abrir Áurea').then(function(ok){ok?unlock():draw()})}
function vis(active){
 if(active===LK.act)return;LK.act=active;
 if(!LK.on)return;
 var now=Date.now();
 if(!active){
  if(LK.busy)return;
  LK.away=now;ssS('away',String(now));
  if(!LK.locked){LK.cover=1;draw()}
 }else{
  if(LK.busy)return;
  LK.cover=0;
  if(LK.locked){draw();if(now>=LK.quiet)setTimeout(prompt,150);return}
  if(LK.away&&now-LK.away>=GRACE){lock();setTimeout(prompt,150)}
  else{LK.away=0;ssS('away',null);draw()}}}
function row(){
 var nat=NAT()&&!!API(),on=!!LK.on,note=!NAT()?'Disponible solo en la app de Android.':!API()?'No se cargó el puente biométrico. Comprueba que aurea-biometric.js esté incluido en la app.':on?'Activo. Se vuelve a pedir tras '+GRACE/1000+' s fuera de Áurea.':'Solicita la autenticación del dispositivo. No guarda tu PIN ni tus credenciales.';
 return '<div class="fl">Seguridad y privacidad</div><div class="kv" style="align-items:center;gap:14px"><div class="g"><div class="t">Bloqueo de la aplicación</div><div class="sm">'+note+'</div></div><button type="button" class="sw" role="switch" aria-checked="'+(on?'true':'false')+'" data-lock="1" aria-label="Bloqueo de la aplicación"'+(nat?'':' disabled')+'></button></div>'}
function refresh(){try{if(typeof redraw==='function'&&V&&V.k==='set'&&!V.sub)redraw()}catch(_){}}
function say(m){try{toast(m)}catch(_){}}
function toggle(){
 if(LK.busy&&Date.now()-LK.busyAt<STALE)return Promise.resolve();
 var N=API();
 if(!NAT()||!N){say('El bloqueo solo está disponible en la app de Android');return Promise.resolve()}
 var turningOn=!LK.on,pre=Promise.resolve(true);
 if(turningOn&&typeof N.check==='function')pre=Promise.resolve().then(function(){return N.check()}).then(function(c){return !!(c&&(c.isAvailable||c.deviceIsSecure))},function(){return true});
 return pre.then(function(can){
  if(!can){say('Primero activa un bloqueo de pantalla o una huella en los ajustes de Android');return}
  return auth(turningOn?'Confirma para activar el bloqueo':'Confirma para desactivar el bloqueo',turningOn?'Activar el bloqueo de Áurea':'Desactivar el bloqueo de Áurea').then(function(ok){
   if(ok){
    if(turningOn){if(!lsS(KEY,'1')){say('No se pudo guardar el ajuste');return}LK.on=1;ssS('ok','1');say('Bloqueo activado')}
    else{lsS(KEY,null);LK.on=0;LK.locked=0;LK.cover=0;ssS('ok',null);ssS('away',null);say('Bloqueo desactivado')}
   }else{
    var c=LK.err;say(c==='userCancel'||c==='systemCancel'||c==='appCancel'?(turningOn?'No se activó el bloqueo':'El bloqueo sigue activado'):(M[c]||DEF))}
   draw();refresh()})})}
$i('lkl').src=(document.querySelector('.lg')||{}).src||'';
LK.on=lsG(KEY)==='1';
if(LK.on){
 var away=+ssG('away')||0,ok=ssG('ok')==='1';
 if(ok&&(!away||Date.now()-away<GRACE)){LK.locked=0;LK.away=0;ssS('away',null)}else{LK.locked=1;ssS('ok',null)}
 draw();
 if(LK.locked)setTimeout(prompt,500)}
btn.onclick=prompt;
document.addEventListener('visibilitychange',function(){vis(!document.hidden)});
try{var A=API();if(A&&typeof A.onState==='function')A.onState(vis)}catch(_){}
window.AureaLock={row:row,toggle:toggle,isOn:function(){return !!LK.on}};
})();
