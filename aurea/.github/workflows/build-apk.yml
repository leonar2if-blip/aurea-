name: Compilar APK de Áurea (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Aceptar licencias Android
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar aplicación web
        run: npm run build:web

      - name: Generar proyecto Android
        run: |
          if [ ! -d android ]; then
            npx --no-install cap add android
          fi

      - name: Configurar versión e icono
        run: node patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Configurar avisos, sonidos y permisos
        run: node patch-android-extras.mjs

      - name: Instalar widgets nativos
        run: node patch-android-widgets.mjs

      - name: Instalar copias externas (Descargas/ÁUREA)
        run: node patch-android-backup.mjs

      - name: Instalar rutinas nativas (atajos, batería, Samsung)
        run: node patch-android-routines.mjs

      - name: Instalar inicio de sesión con Google (Drive)
        run: node patch-android-gauth.mjs

      - name: Sincronizar Capacitor
        run: npx --no-install cap sync android

      - name: Verificar plugins, bloqueo, icono y avisos
        run: |
          npx --no-install cap ls android | tee plugins.txt
          grep -q "capacitor-biometric-auth" plugins.txt
          grep -q "@capacitor/app" plugins.txt
          grep -q "@capacitor/local-notifications" plugins.txt
          grep -q "@capacitor/filesystem" plugins.txt
          grep -q "@capacitor/share" plugins.txt
          grep -q 'id="lock"' android/app/src/main/assets/public/index.html
          grep -q "AureaLock" android/app/src/main/assets/public/index.html
          grep -q 'src="aurea-features.js"' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/aurea-biometric.js
          test -f android/app/src/main/assets/public/aurea-native.js
          test -f android/app/src/main/assets/public/aurea-features.js
          test -f android/app/src/main/assets/public/aurea-widgets.js
          test -f android/app/src/main/assets/public/aurea-automation.js
          grep -q 'src="aurea-automation.js"' android/app/src/main/assets/public/index.html
          grep -q "registerPlugin(AureaRoutinesPlugin.class)" android/app/src/main/java/com/leonar2if/aurea/MainActivity.java
          test -f android/app/src/main/java/com/leonar2if/aurea/AureaRoutinesPlugin.java
          grep -q 'src="aurea-widgets.js"' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/java/com/leonar2if/aurea/WRender.java
          grep -q "registerPlugin(AureaWidgetsPlugin.class)" android/app/src/main/java/com/leonar2if/aurea/MainActivity.java
          test "$(grep -c 'android.appwidget.provider' android/app/src/main/AndroidManifest.xml)" = "12"
          grep -q 'android:scheme="aurea"' android/app/src/main/AndroidManifest.xml
          grep -q "registerPlugin(AureaGoogleAuthPlugin.class)" android/app/src/main/java/com/leonar2if/aurea/MainActivity.java
          grep -q "play-services-auth" android/app/build.gradle
          grep -q "registerPlugin(AureaBackupsPlugin.class)" android/app/src/main/java/com/leonar2if/aurea/MainActivity.java
          grep -q "registerPlugin(AureaWidgetsPlugin.class)" android/app/src/main/java/com/leonar2if/aurea/MainActivity.java
          test -f android/app/src/main/java/com/leonar2if/aurea/AureaBackupsPlugin.java
          grep -q 'WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            grep -q "android.permission.$p" android/app/src/main/AndroidManifest.xml
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground ic_launcher_background; do
              test -f "android/app/src/main/res/mipmap-$d/$n.png"
            done
            test -f "android/app/src/main/res/drawable-$d/ic_stat_aurea.png"
          done
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/raw/aurea_suave.wav
          test -f android/app/src/main/res/raw/aurea_alarma.wav

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Comprobar icono y permisos dentro del APK (informativo)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E "ic_launcher|ic_stat_aurea|aurea_suave|aurea_alarma" || true
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" || true
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i -E "BOOT_COMPLETED|LocalNotification" || true

      - name: Preparar APK
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "Aurea-${VER}-build${{ github.run_number }}-debug.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurea-debug-apk
          path: Aurea-*-debug.apk
          if-no-files-found: error
          retention-days: 30
